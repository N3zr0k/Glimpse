name: Release

# Ein Tag wie v0.2.0 baut das Paket und legt ein GitHub-Release an. Das Tag muss zur Version in
# der TOC und zu einem Abschnitt im CHANGELOG passen (prüft tools/check.py). Tags mit "-beta" oder
# "-alpha" (z. B. v0.2.1-beta.1) werden als Prerelease veröffentlicht. Beta braucht den Abschnitt
# "## [X.Y.Z]" im CHANGELOG, Alpha reicht "## [Unreleased]".
#
# Normalerweise setzt die CI das Tag selbst (ci.yml) und startet diesen Workflow danach per
# workflow_dispatch auf dem Tag. Das ist nötig, weil ein mit dem GITHUB_TOKEN gepushtes Tag keinen
# Push-Workflow auslöst. Ein von Hand gepushtes Tag funktioniert ebenfalls. Bei einem Start per Hand
# muss als Ref das Tag gewählt werden, nicht ein Branch.
# CurseForge, Wago und WoWInterface werden nur bedient, wenn das jeweilige Secret gesetzt ist
# (siehe README, Abschnitt Veröffentlichen).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sicherstellen, dass auf einem Tag gebaut wird
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Der Workflow muss auf einem Tag laufen (Ref $GITHUB_REF), nicht auf einem Branch."
            exit 1
          fi

      - name: Tag, TOC-Version und CHANGELOG prüfen
        run: python3 tools/check.py --tag "$TAG"

      - name: Paket bauen und veröffentlichen
        uses: BigWigsMods/packager@v2

      - name: Zip prüfen
        run: |
          shopt -s nullglob
          zips=(.release/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::Der Packager hat kein Zip in .release/ erzeugt."
            ls -la .release 2>/dev/null || true
            exit 1
          fi
          printf 'Zip: %s\n' "${zips[@]}"

      # Sicherheitsnetz: Vorabversionen müssen auf GitHub als Prerelease erscheinen, auch wenn der
      # Packager das Release nicht selbst angelegt oder markiert hat.
      - name: Prerelease sicherstellen
        if: contains(env.TAG, '-beta') || contains(env.TAG, '-alpha')
        run: |
          shopt -s nullglob
          zips=(.release/*.zip)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --prerelease
          else
            gh release create "$TAG" --prerelease --title "$TAG" --generate-notes "${zips[@]}"
          fi
